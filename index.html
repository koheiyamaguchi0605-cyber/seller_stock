<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="セラーストック">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>セラーストック</title>
</head>
<body>
<style>*{box-sizing:border-box;margin:0;padding:0}.app{max-width:390px;margin:0 auto;background:var(--color-background-tertiary);font-family:var(--font-sans)}.header{background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:14px 16px 10px;position:sticky;top:0;z-index:10}.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.app-title{font-size:17px;font-weight:500;color:var(--color-text-primary)}.hbtns{display:flex;gap:6px}.ibtn{width:34px;height:34px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--color-text-secondary)}.ibtn:hover{background:var(--color-background-tertiary)}.tabs{display:flex;gap:4px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:3px}.tab{flex:1;padding:6px 4px;font-size:12px;text-align:center;border-radius:6px;cursor:pointer;color:var(--color-text-secondary);border:none;background:none}.tab.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;border:0.5px solid var(--color-border-tertiary)}.content{padding:12px 16px}.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}.sc{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:9px 12px}.sl{font-size:11px;color:var(--color-text-secondary);margin-bottom:2px}.sv{font-size:18px;font-weight:500;color:var(--color-text-primary)}.sv.amb{color:#854F0B}.filter-row{display:flex;gap:6px;margin-bottom:10px;align-items:center}.si{flex:1;height:34px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);padding:0 10px;font-size:13px;color:var(--color-text-primary)}.ssel{height:34px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);padding:0 8px;font-size:12px;color:var(--color-text-primary)}.abtn{height:34px;padding:0 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);font-size:13px;font-weight:500;color:var(--color-text-primary);cursor:pointer;white-space:nowrap}.abtn:hover{background:var(--color-background-secondary)}.sort-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.sort-chip{height:26px;padding:0 10px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);font-size:11px;color:var(--color-text-secondary);cursor:pointer;white-space:nowrap}.sort-chip.active{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}.items-list{display:flex;flex-direction:column;gap:8px}.ic{background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);overflow:hidden}.ic:hover{border-color:var(--color-border-secondary)}.ic-body{display:flex;gap:10px;padding:12px 12px 8px}.ic-img{width:60px;height:60px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);object-fit:contain;background:var(--color-background-secondary);flex-shrink:0}.ic-img-ph{width:60px;height:60px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}.ic-info{flex:1;min-width:0}.ic-prices{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.pi{flex:1;min-width:58px}.pl{font-size:10px;color:var(--color-text-tertiary);margin-bottom:1px}.pv{font-size:12px;font-weight:500;color:var(--color-text-primary)}.pv.grn{color:#0F6E56}.pv.blu{color:#185FA5}
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW error:', err));
  });
}
</script>
</body>
</html>
