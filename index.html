<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="セラーストック">
<meta name="theme-color" content="#4361EE">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>セラーストック</title>
</head>
<body>
<style>
:root{
  --bg:#F5F6FA;
  --card:#FFFFFF;
  --border:#E8EAF0;
  --text-primary:#1A1D2E;
  --text-secondary:#5C6080;
  --text-tertiary:#9499B5;
  --accent:#4361EE;
  --accent-light:#EEF1FF;
  --green:#0BAB64;
  --green-light:#E6F7F0;
  --amber:#F48C06;
  --amber-light:#FEF3E2;
  --red:#E63946;
  --red-light:#FDECEA;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 2px 12px rgba(0,0,0,0.07);
  --font:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;background:var(--bg);min-height:100vh}

/* ヘッダー */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 16px 12px;position:sticky;top:0;z-index:10;box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.app-title{font-size:18px;font-weight:700;color:var(--text-primary);letter-spacing:-0.3px}
.hbtns{display:flex;gap:8px}
.ibtn{width:36px;height:36px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text-secondary);transition:all 0.15s}
.ibtn:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

/* タブ */
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:var(--radius-sm);padding:3px}
.tab{flex:1;padding:7px 4px;font-size:13px;font-weight:500;text-align:center;border-radius:6px;cursor:pointer;color:var(--text-tertiary);border:none;background:none;transition:all 0.15s}
.tab.active{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,0.1)}

.content{padding:14px 16px}

/* サマリーカード */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.sc{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.sl{font-size:11px;font-weight:600;color:var(--text-tertiary);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px}
.sv{font-size:22px;font-weight:700;color:var(--text-primary);line-height:1}
.sv span{font-size:12px;font-weight:500;color:var(--text-tertiary)}
.sv.grn{color:var(--green)}
.sv.amb{color:var(--amber)}
.sv.red{color:var(--red)}

/* フィルター */
.filter-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.si{flex:1;height:40px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card);padding:0 12px;font-size:14px;color:var(--text-primary);outline:none;transition:border 0.15s}
.si:focus{border-color:var(--accent)}
.ssel{height:40px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card);padding:0 10px;font-size:13px;color:var(--text-primary);outline:none}
.abtn{height:40px;padding:0 16px;border-radius:var(--radius-sm);border:none;background:var(--accent);font-size:14px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;transition:opacity 0.15s}
.abtn:hover{opacity:0.88}

/* ソートチップ */
.sort-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sort-chip{height:28px;padding:0 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:all 0.15s}
.sort-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 商品カード */
.items-list{display:flex;flex-direction:column;gap:10px}
.ic{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
.ic-body{display:flex;gap:12px;padding:14px 14px 10px}
.ic-img{width:64px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border);object-fit:contain;background:var(--bg);flex-shrink:0}
.ic-img-ph{width:64px;height:64px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.ic-info{flex:1;min-width:0}
.ic-name{font-size:14px;font-weight:600;color:var(--text-primary);line-height:1.4;margin-bottom:4px}
.ic-codes{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.ic-code-row{display:flex;align-items:center;gap:6px}
.ic-code-label{font-size:10px;font-weight:700;color:var(--text-tertiary);width:34px;flex-shrink:0;letter-spacing:0.3px}
.ic-prices{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pi{background:var(--bg);border-radius:6px;padding:5px 6px}
.pl{font-size:10px;font-weight:600;color:var(--text-tertiary);margin-bottom:2px;white-space:nowrap}
.pv{font-size:12px;font-weight:700;color:var(--text-primary)}
.pv.grn{color:var(--green)}
.pv.blu{color:var(--accent)}
.ic-footer{border-top:1px solid var(--border);padding:9px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--bg)}
.ic-meta{font-size:11px;color:var(--text-tertiary);flex:1;min-width:0;line-height:1.5}
.ic-actions{display:flex;gap:6px;flex-shrink:0}
.mb{height:28px;padding:0 10px;font-size:11px;font-weight:600;border-radius:6px;border:1.5px solid var(--border);background:var(--card);color:var(--text-secondary);cursor:pointer;transition:all 0.15s}
.mb:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.mb.del{border-color:#FFCDD2;color:var(--red)}
.mb.del:hover{background:var(--red-light);border-color:var(--red)}

/* コピー可能 */
.copyable{display:inline-flex;align-items:center;gap:4px;cursor:pointer;border-radius:4px;padding:1px 5px;margin:-1px -5px;transition:background 0.1s}
.copyable:hover{background:var(--accent-light)}
.copy-icon{font-size:11px;color:var(--text-tertiary);opacity:0;flex-shrink:0;transition:opacity 0.15s}
.copyable:hover .copy-icon{opacity:1}
.copy-flash{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text-primary);color:#fff;font-size:12px;font-weight:600;padding:8px 18px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity 0.2s;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.18)}
.copy-flash.show{opacity:1}

/* バッジ */
.days-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}

/* 空状態 */
.empty{text-align:center;padding:48px 20px;color:var(--text-tertiary);font-size:14px;font-weight:500}

/* モーダル */
.ov{display:none;position:absolute;top:0;left:0;right:0;min-height:100%;background:rgba(26,29,46,0.5);z-index:20;align-items:flex-end;backdrop-filter:blur(2px)}
.ov.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-height:92vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mt{font-size:17px;font-weight:700;color:var(--text-primary)}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1.5px solid var(--border);font-size:16px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.xbtn:hover{background:var(--red-light);border-color:var(--red);color:var(--red)}
.fg{margin-bottom:12px}
.fl{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;display:block;letter-spacing:0.2px}
.fi{width:100%;height:42px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);padding:0 12px;font-size:14px;color:var(--text-primary);outline:none;transition:border 0.15s;font-family:var(--font)}
.fi:focus{border-color:var(--accent);background:var(--card)}
.fr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pp{background:var(--green-light);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(11,171,100,0.2)}
.ppl{font-size:12px;font-weight:600;color:var(--green)}
.ppv{font-size:16px;font-weight:700;color:var(--green)}
.sbtn{width:100%;height:46px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-top:6px;letter-spacing:0.2px;transition:opacity 0.15s;font-family:var(--font)}
.sbtn:hover{opacity:0.88}
.sbtn.sec{background:var(--bg);color:var(--text-primary);border:1.5px solid var(--border);margin-top:0}
.sbtn.sec:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.sbtn.danger{background:var(--red);color:#fff;margin-top:0}
.sbtn.danger:hover{opacity:0.88}
.scan-area{background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px;text-align:center;cursor:pointer;border:2px dashed var(--border);transition:all 0.15s}
.scan-area:hover{border-color:var(--accent);background:var(--accent-light)}
.img-ph{width:68px;height:68px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.img-loading{width:68px;height:68px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.img-custom{width:68px;height:68px;border-radius:var(--radius-sm);border:1.5px solid var(--border);object-fit:cover;flex-shrink:0}
.img-preview-asin{width:68px;height:68px;border-radius:var(--radius-sm);border:1.5px solid var(--border);object-fit:contain;background:var(--bg);flex-shrink:0}
.spinner{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.asin-status{display:flex;align-items:center;gap:6px;margin-top:5px;min-height:18px}
.asin-status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.asin-status-txt{font-size:11px;font-weight:600}
.asin-ok .asin-status-dot{background:var(--green)}.asin-ok .asin-status-txt{color:var(--green)}
.asin-err .asin-status-dot{background:var(--red)}.asin-err .asin-status-txt{color:var(--red)}
.asin-loading .asin-status-dot{background:var(--accent);animation:pulse 1s infinite}.asin-loading .asin-status-txt{color:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.img-wrapper{position:relative;width:68px;flex-shrink:0}
.img-clear-btn{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* 撮影ボタン */
.photo-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.photo-btn{height:46px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s}
.photo-btn:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.photo-btn-icon{font-size:18px}

/* 在庫テーブル */
.stock-tbl{width:100%;font-size:13px;border-collapse:collapse;table-layout:fixed}
.stock-tbl th{text-align:left;color:var(--text-tertiary);font-weight:700;font-size:11px;letter-spacing:0.5px;padding:0 0 10px;border-bottom:2px solid var(--border)}
.stock-tbl td{padding:10px 0;border-bottom:1px solid var(--border);color:var(--text-primary);vertical-align:middle}
.stock-tbl tr:last-child td{border-bottom:none}
.qc{display:flex;align-items:center;gap:6px}
.qb{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-primary);transition:all 0.15s;font-weight:700}
.qb:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.qv{font-size:14px;font-weight:700;width:24px;text-align:center}
.cs{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.ct{font-size:13px;font-weight:700;color:var(--text-secondary);margin-bottom:14px;letter-spacing:0.2px}

/* チャート */
.br{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:8px}
.blbl{font-size:11px;font-weight:600;color:var(--text-secondary);width:80px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrk{flex:1;height:20px;background:var(--bg);border-radius:6px;overflow:hidden}
.bfil{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:7px;transition:width 0.4s ease}
.bfil.p{background:linear-gradient(90deg,#0BAB64,#34D399)}
.bfil.c{background:linear-gradient(90deg,#F48C06,#FCD34D)}
.bfil.v{background:linear-gradient(90deg,#4361EE,#818CF8)}
.legend{display:flex;gap:12px;margin-top:10px}
.li{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text-secondary)}
.ld{width:10px;height:10px;border-radius:50%}

/* Keepaバナー */
.keepa-banner{background:var(--accent-light);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;border:1px solid rgba(67,97,238,0.2)}
.keepa-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.keepa-txt{font-size:12px;font-weight:600;color:var(--accent);flex:1}
.keepa-set{font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;text-decoration:underline;white-space:nowrap}
.keepa-warn{background:var(--amber-light);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;border:1px solid rgba(244,140,6,0.2)}
.keepa-warn-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0}
.keepa-warn-txt{font-size:12px;font-weight:600;color:var(--amber);flex:1}

/* 設定 */
.api-key-box{background:var(--bg);border-radius:var(--radius-sm);padding:14px;margin-bottom:14px;border:1px solid var(--border)}
.api-key-label{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:8px}
.api-key-row{display:flex;gap:8px}
.api-key-input{flex:1;height:40px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card);padding:0 12px;font-size:13px;color:var(--text-primary);font-family:monospace;outline:none}
.api-key-input:focus{border-color:var(--accent)}
.api-save-btn{height:40px;padding:0 14px;border-radius:var(--radius-sm);border:none;background:var(--accent);font-size:13px;font-weight:700;color:#fff;cursor:pointer}
.settings-section{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.settings-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:14px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent-light);color:var(--accent);margin-left:6px;letter-spacing:0.3px}
.master-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.master-item{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;border:1px solid var(--border)}
.master-item-name{flex:1;font-size:13px;font-weight:500;color:var(--text-primary)}
.master-del{height:26px;width:26px;border-radius:6px;border:1.5px solid var(--border);background:none;color:var(--text-tertiary);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.master-del:hover{color:var(--red);border-color:var(--red);background:var(--red-light)}
.master-empty{font-size:13px;color:var(--text-tertiary);padding:8px 0;font-weight:500}
.master-add-row{display:flex;gap:8px}
.master-add-input{flex:1;height:40px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);padding:0 12px;font-size:13px;color:var(--text-primary);outline:none;font-family:var(--font)}
.master-add-input:focus{border-color:var(--accent)}
.master-add-btn{height:40px;padding:0 14px;border-radius:var(--radius-sm);border:none;background:var(--accent);font-size:13px;font-weight:700;color:#fff;cursor:pointer}
.settings-tabs{display:flex;gap:4px;background:var(--bg);border-radius:var(--radius-sm);padding:3px;margin-bottom:16px;border:1px solid var(--border)}
.settings-tab{flex:1;padding:8px 4px;font-size:12px;font-weight:600;text-align:center;border-radius:6px;cursor:pointer;color:var(--text-tertiary);border:none;background:none;transition:all 0.15s}
.settings-tab.active{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,0.1)}

/* 削除確認 */
.del-confirm-box{background:var(--red-light);border-radius:var(--radius-sm);padding:16px;margin-bottom:16px;border:1px solid rgba(230,57,70,0.2)}
.del-confirm-name{font-size:14px;font-weight:700;color:var(--red);margin-bottom:6px;line-height:1.4;word-break:break-all}
.del-confirm-msg{font-size:13px;color:#C0392B;margin-bottom:16px;font-weight:500}
.del-btn-row{display:flex;gap:8px}
.del-btn-row .sbtn{margin-top:0;flex:1}

/* 保管日数設定 */
.days-cfg-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;border:1px solid var(--border)}
.days-cfg-label{font-size:13px;font-weight:500;color:var(--text-secondary);flex:1}
.days-cfg-right{display:flex;align-items:center;gap:8px}
.days-num-input{width:56px;height:34px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--card);padding:0 8px;font-size:13px;font-weight:600;color:var(--text-primary);text-align:center;outline:none;font-family:var(--font)}
.color-swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.color-swatch input[type=color]{position:absolute;opacity:0;width:200%;height:200%;top:-50%;left:-50%;cursor:pointer}
.days-cfg-preview{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
</style>

<div class="copy-flash" id="copy-flash"></div>
<input type="file" id="cam-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)"/>
<input type="file" id="lib-input" accept="image/*" style="display:none" onchange="handlePhoto(this)"/>

<div class="app" id="app">
  <div class="header">
    <div class="header-top">
      <div class="app-title">セラーストック <span class="tag">Keepa</span></div>
      <div class="hbtns">
        <button class="ibtn" onclick="openSettings()" title="設定">&#9881;</button>
        <button class="ibtn" onclick="doScan()" title="スキャン">&#9638;</button>
        <button class="ibtn" onclick="openAdd()" title="追加">＋</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('inv',this)">在庫一覧</button>
      <button class="tab" onclick="switchTab('stock',this)">在庫数</button>
      <button class="tab" onclick="switchTab('ana',this)">分析</button>
    </div>
  </div>
  <div class="content" id="mc"></div>

  <div class="ov" id="modal-ov">
    <div class="modal">
      <div class="mh">
        <div class="mt" id="modal-ttl">商品を追加</div>
        <button class="xbtn" onclick="closeModal()">✕</button>
      </div>
      <div class="scan-area" onclick="doScan()">
        <div style="font-size:18px;margin-bottom:3px">&#9638;</div>
        <div style="font-size:12px;font-weight:600;color:var(--text-secondary)">バーコードをスキャンして自動入力</div>
      </div>

<script>
const SK='seller_stock_v3',AK='sedori_keepa_api',MK='sedori_masters_v5',DK='seller_days_cfg';
let items=[],tab='inv',searchQ='',sortBy='date_desc',filterCat='all',editId=null,keepaApiKey='';
let deleteTargetId=null,customPhotoData=null;
let masters={stores:['コストコ','ドン・キホーテ','業務スーパー','ウエルシア','マツモトキヨシ'],locs:['棚A-1','棚A-2','棚A-3','棚B-1','棚B-2','棚B-3','棚C-1'],cats:['日用品','洗剤','シャンプー','食品','化粧品','その他']};
let daysCfg=[{maxDays:14,color:'#1D9E75',textColor:'#04342C',label:'14日以内'},{maxDays:30,color:'#EF9F27',textColor:'#412402',label:'30日以内'},{maxDays:999,color:'#E24B4A',textColor:'#501313',label:'30日超'}];
const SORTS=[{k:'date_desc',l:'新着順'},{k:'profit_desc',l:'利益高'},{k:'margin_desc',l:'利益率高'},{k:'stock_asc',l:'在庫少'},{k:'name_asc',l:'名前順'},{k:'days_desc',l:'保管長'}];
let asinDebounceTimer=null,currentFetchAsin='';

async function load(){
  try{const r=await window.storage.get(SK);if(r&&r.value)items=JSON.parse(r.value);else items=sample();}catch(e){items=sample();}
  try{const k=await window.storage.get(AK);if(k&&k.value)keepaApiKey=k.value;}catch(e){}
  try{const m=await window.storage.get(MK);if(m&&m.value)masters=JSON.parse(m.value);}catch(e){}
  try{const d=await window.storage.get(DK);if(d&&d.value)daysCfg=JSON.parse(d.value);}catch(e){}
  render();
}
async function saveItems(){try{await window.storage.set(SK,JSON.stringify(items));}catch(e){}}
async function saveMasters(){try{await window.storage.set(MK,JSON.stringify(masters));}catch(e){}}
async function saveApiKey(){
  const v=document.getElementById('settings-api-key').value.trim();
  if(!v){alert('APIキーを入力してください');return;}
  keepaApiKey=v;
  try{await window.storage.set(AK,v);document.getElementById('api-key-status').textContent='保存しました';document.getElementById('api-key-status').style.color='#0F6E56';setTimeout(()=>{document.getElementById('api-key-status').textContent='';},2000);}
  catch(e){alert('保存に失敗しました');}
}

function sample(){
  return[
    {id:1,name:'花王 アタック 詰め替え 810g',jan:'4901301382948',asin:'B07MK9FXMH',cost:298,sell:680,qty:15,cat:'洗剤',loc:'棚A-1',store:'コストコ',date:'2025-04-10'},
    {id:2,name:'パンテーン シャンプー 詰め替え',jan:'4902430719568',asin:'B07Q5JXNFL',cost:398,sell:920,qty:8,cat:'シャンプー',loc:'棚B-2',store:'ドン・キホーテ',date:'2025-04-15'},
    {id:3,name:'スコッティ ティッシュ 5箱パック',jan:'4901750800421',asin:'B00LMKJGP0',cost:198,sell:380,qty:2,cat:'日用品',loc:'棚A-3',store:'コストコ',date:'2025-04-18'},
    {id:4,name:'バスマジックリン 詰め替え',jan:'4901301060174',asin:'B07PHRCC3J',cost:178,sell:498,qty:0,cat:'洗剤',loc:'棚C-1',store:'業務スーパー',date:'2025-03-28'},
    {id:5,name:'メリット シャンプー 詰め替え',jan:'4987176102362',asin:'B07QK3V6WF',cost:348,sell:780,qty:22,cat:'シャンプー',loc:'棚B-3',store:'ドン・キホーテ',date:'2025-04-20'},
  ];
}

function calcP(c,s){return s-c-Math.round(s*0.15);}
function calcM(c,s){return Math.round((calcP(c,s)/s)*100);}
function fmt(n){return n.toLocaleString('ja-JP')+'円';}
function imgUrl(asin){return asin?`https://images-na.ssl-images-amazon.com/images/P/${asin}.jpg`:null;}
function calcDays(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr),now=new Date();
  now.setHours(0,0,0,0);d.setHours(0,0,0,0);
  return Math.max(0,Math.round((now-d)/(1000*60*60*24)));
}
function getDaysCfg(days){
  if(days===null)return null;
  const s=[...daysCfg].sort((a,b)=>a.maxDays-b.maxDays);
  for(const c of s){if(days<=c.maxDays)return c;}
  return s[s.length-1];
}
function daysBadge(days){
  if(days===null)return'';
  const c=getDaysCfg(days);if(!c)return'';
  return`<span class="days-badge" style="background:${c.color}20;color:${c.textColor};border:1px solid ${c.color}40">${days}日保管</span>`;
}

function handlePhoto(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    customPhotoData=e.target.result;
    updateImgWrap();
    updatePhotoBtnArea();
  };
  reader.readAsDataURL(file);
  input.value='';
}
function updateImgWrap(){
  const wrap=document.getElementById('img-preview-wrap');if(!wrap)return;
  const asin=(document.getElementById('f-asin')||{}).value||'';
  if(customPhotoData){
    wrap.innerHTML=`<div class="img-wrapper"><img class="img-custom" src="${customPhotoData}" alt=""/><button class="img-clear-btn" onclick="clearPhoto()" title="削除">✕</button></div>`;
  } else if(asin.length>=10){
    wrap.innerHTML=`<img class="img-preview-asin" src="${imgUrl(asin)}" onerror="this.className='img-ph';this.innerHTML='&#128247;'" alt=""/>`;
  } else {
    wrap.innerHTML=`<div class="img-ph">&#128247;</div>`;
  }
}
function updatePhotoBtnArea(){
  const area=document.getElementById('photo-btn-area');if(!area)return;
  const asin=(document.getElementById('f-asin')||{}).value||'';
  area.style.display=(asin.length>=10&&!customPhotoData)?'none':'grid';
  if(customPhotoData){
    area.innerHTML=`
      <button class="photo-btn" onclick="document.getElementById('cam-input').click()">
        <span class="photo-btn-icon">&#128247;</span><span>再撮影</span>
      </button>
      <button class="photo-btn" onclick="document.getElementById('lib-input').click()">
        <span class="photo-btn-icon">&#128444;</span><span>別の画像を選択</span>
      </button>`;
  } else {
    area.innerHTML=`
      <button class="photo-btn" onclick="document.getElementById('cam-input').click()">
        <span class="photo-btn-icon">&#128247;</span><span>カメラ撮影</span>
      </button>
      <button class="photo-btn" onclick="document.getElementById('lib-input').click()">
        <span class="photo-btn-icon">&#128444;</span><span>ライブラリから選択</span>
      </button>`;
  }
}
function clearPhoto(){
  customPhotoData=null;
  updateImgWrap();
  updatePhotoBtnArea();
}

let flashTimer=null;
function copyText(text,label){
  const doFlash=()=>{const el=document.getElementById('copy-flash');el.textContent=(label||text)+' をコピーしました';el.classList.add('show');if(flashTimer)clearTimeout(flashTimer);flashTimer=setTimeout(()=>el.classList.remove('show'),1600);};
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(doFlash).catch(()=>{fallbackCopy(text);doFlash();});}else{fallbackCopy(text);doFlash();}
}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function copyableSpan(text,label){if(!text)return'';return`<span class="copyable" onclick="copyText('${text.replace(/'/g,"\\'")}','${(label||text).replace(/'/g,"\\'")}')"><span style="font-size:11px;color:var(--color-text-secondary);font-family:var(--font-mono)">${text}</span><span class="copy-icon">&#10697;</span></span>`;}
function copyableName(text){if(!text)return'';return`<span class="copyable" onclick="copyText('${text.replace(/'/g,"\\'")}','商品名')"><span class="ic-name">${text}</span><span class="copy-icon">&#10697;</span></span>`;}

function setAsinStatus(state,msg){const el=document.getElementById('asin-status');if(!el)return;if(!state){el.innerHTML='';return;}el.className='asin-status '+state;el.innerHTML=`<div class="asin-status-dot"></div><span class="asin-status-txt">${msg}</span>`;}

function onAsinInput(val){
  const asin=val.trim();
  if(asinDebounceTimer)clearTimeout(asinDebounceTimer);
  updateImgWrap();
  updatePhotoBtnArea();
  if(!asin){setAsinStatus('','');return;}
  if(asin.length<10){setAsinStatus('','');return;}
  if(!keepaApiKey){setAsinStatus('','');return;}
  if(!customPhotoData){const wrap=document.getElementById('img-preview-wrap');if(wrap)wrap.innerHTML='<div class="img-loading"><div class="spinner"></div></div>';}
  setAsinStatus('asin-loading','取得中...');
  asinDebounceTimer=setTimeout(()=>fetchKeepaAuto(asin),700);
}
async function fetchKeepaAuto(asin){
  if(!keepaApiKey||!asin)return;
  currentFetchAsin=asin;
  try{
    const r=await fetch(`https://api.keepa.com/product?key=${keepaApiKey}&domain=5&asin=${asin}&stats=1&history=0`);
    if(asin!==currentFetchAsin)return;
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    if(asin!==currentFetchAsin)return;
    if(!data.products||!data.products.length)throw new Error('商品が見つかりません');
    const p=data.products[0];
    const title=p.title||'';
    const nf=document.getElementById('f-name');
    if(nf&&(!nf.value.trim()||nf.dataset.autoFilled==='1')){nf.value=title.substring(0,80);nf.dataset.autoFilled='1';}
    if(!customPhotoData){const wrap=document.getElementById('img-preview-wrap');if(wrap)wrap.innerHTML=`<img class="img-preview-asin" src="${imgUrl(p.asin||asin)}" onerror="this.className='img-ph';this.innerHTML='&#128247;'" alt=""/>`;}
    const nowArr=p.stats&&p.stats.current;
    const nowPrice=nowArr&&nowArr[1]>0?Math.round(nowArr[1]/100):null;
    if(nowPrice){const sf=document.getElementById('f-sell');if(sf&&!sf.value){sf.value=nowPrice;updatePP();}}
    setAsinStatus('asin-ok',`取得完了${nowPrice?' · Amazon '+nowPrice.toLocaleString()+'円':''}`);
  }catch(e){
    if(asin!==currentFetchAsin)return;
    if(!customPhotoData)updateImgWrap();
    setAsinStatus('asin-err','取得失敗: '+e.message);
  }
}

function applySort(arr){
  return [...arr].sort((a,b)=>{
    if(sortBy==='date_desc')return(b.date||'').localeCompare(a.date||'');
    if(sortBy==='profit_desc')return calcP(b.cost,b.sell)-calcP(a.cost,a.sell);
    if(sortBy==='margin_desc')return calcM(b.cost,b.sell)-calcM(a.cost,a.sell);
    if(sortBy==='stock_asc')return a.qty-b.qty;
    if(sortBy==='name_asc')return a.name.localeCompare(b.name,'ja');
    if(sortBy==='days_desc'){return (calcDays(b.date)??0)-(calcDays(a.date)??0);}
    return 0;
  });
}
function switchTab(t,el){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render();}
function render(){const el=document.getElementById('mc');if(tab==='inv')el.innerHTML=renderInv();else if(tab==='stock')el.innerHTML=renderStock();else el.innerHTML=renderAna();}
function keepaBanner(){
  if(keepaApiKey)return`<div class="keepa-banner"><div class="keepa-dot"></div><div class="keepa-txt">Keepa API 連携中 — ASIN入力で自動同期</div><span class="keepa-set" onclick="openSettings()">設定</span></div>`;
  return`<div class="keepa-warn"><div class="keepa-warn-dot"></div><div class="keepa-warn-txt">Keepa APIキー未設定</div><span class="keepa-set" onclick="openSettings()">設定する</span></div>`;
}
function renderInv(){
  let filtered=items.filter(i=>(filterCat==='all'||i.cat===filterCat)&&(i.name.includes(searchQ)||(i.jan||'').includes(searchQ)||(i.asin||'').includes(searchQ)||(i.loc||'').includes(searchQ)));
  filtered=applySort(filtered);
  const totalQty=items.reduce((s,i)=>s+i.qty,0),totalCost=items.reduce((s,i)=>s+i.cost*i.qty,0),low=items.filter(i=>i.qty>0&&i.qty<=3).length;
  let h=keepaBanner();
  h+=`<div class="stats-grid">
    <div class="sc"><div class="sl">総在庫数</div><div class="sv">${totalQty}<span style="font-size:12px;font-weight:400;color:var(--color-text-secondary)"> 点</span></div></div>
    <div class="sc"><div class="sl">仕入れ総額</div><div class="sv amb" style="font-size:15px">${totalCost.toLocaleString()}<span style="font-size:10px;font-weight:400"> 円</span></div></div>
    <div class="sc"><div class="sl">商品数</div><div class="sv">${items.length}<span style="font-size:12px;font-weight:400;color:var(--color-text-secondary)"> 件</span></div></div>
    <div class="sc"><div class="sl">要補充</div><div class="sv ${low>0?'red':''}">${low}<span style="font-size:12px;font-weight:400;color:var(--color-text-secondary)"> 件</span></div></div>
  </div>
  <div class="filter-row">
    <input class="si" placeholder="商品名・ASIN・JAN・場所で検索" value="${searchQ}" oninput="searchQ=this.value;render()"/>
    <select class="ssel" onchange="filterCat=this.value;render()">
      <option value="all">全て</option>
      ${masters.cats.map(c=>`<option value="${c}" ${filterCat===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <button class="abtn" onclick="openAdd()">＋</button>
  </div>
  <div class="sort-row">${SORTS.map(s=>`<button class="sort-chip ${sortBy===s.k?'active':''}" onclick="sortBy='${s.k}';render()">${s.l}</button>`).join('')}</div>
  <div class="items-list">`;
  if(!filtered.length){h+=`<div class="empty">商品が見つかりません</div>`;}
  else filtered.forEach(item=>{
    const profit=calcP(item.cost,item.sell),margin=calcM(item.cost,item.sell);
    const days=calcDays(item.date);
    let imgTag;
    if(item.customPhoto){imgTag=`<img class="ic-img" src="${item.customPhoto}" alt="" style="object-fit:cover"/>`;}
    else if(item.asin){imgTag=`<img class="ic-img" src="${imgUrl(item.asin)}" onerror="this.style.display='none';this.nextSibling.style.display='flex'" alt=""/><div class="ic-img-ph" style="display:none">&#128247;</div>`;}
    else{imgTag=`<div class="ic-img-ph">&#128247;</div>`;}
    const dateStr=item.date?item.date.replace(/-/g,'/').substring(2):'';
    h+=`<div class="ic">
      <div class="ic-body">
        <div style="flex-shrink:0">${imgTag}</div>
        <div class="ic-info">
          <div>${copyableName(item.name)}</div>
          <div class="ic-codes">
            ${item.asin?`<div class="ic-code-row"><span class="ic-code-label">ASIN</span>${copyableSpan(item.asin,'ASIN')}</div>`:''}
            ${item.jan?`<div class="ic-code-row"><span class="ic-code-label">JAN</span>${copyableSpan(item.jan,'JAN')}</div>`:''}
            ${item.cat||item.loc?`<div class="ic-code-row"><span style="font-size:10px;color:var(--color-text-tertiary)">${item.cat}${item.loc?' · '+item.loc:''}</span></div>`:''}
          </div>
          <div class="ic-prices">
            <div class="pi"><div class="pl">仕入れ価格</div><div class="pv">${fmt(item.cost)}</div></div>
            <div class="pi"><div class="pl">販売価格</div><div class="pv">${fmt(item.sell)}</div></div>
            <div class="pi"><div class="pl">Amazon現在価格</div><div class="pv blu">${item.amzPrice?item.amzPrice.toLocaleString()+'円':'—'}</div></div>
            <div class="pi"><div class="pl">在庫</div><div class="pv">${item.qty}個</div></div>
          </div>
        </div>
      </div>
      <div class="ic-footer">
        <div class="ic-meta">${dateStr?`仕入れ: ${dateStr}${item.store?' / '+item.store:''}`:item.store||''}<span style="margin-left:6px;font-weight:500;color:${margin>=20?'#0F6E56':margin>=10?'#854F0B':'#A32D2D'}">${margin}%</span>${days!==null?' · '+daysBadge(days):''}</div>
        <div class="ic-actions"><button class="mb" onclick="openEdit(${item.id})">編集</button><button class="mb del" onclick="openDelModal(${item.id})">削除</button></div>
      </div>
    </div>`;
  });
  h+=`</div>`;return h;
}
function renderStock(){
  const sorted=[...items].sort((a,b)=>a.qty-b.qty);
  const tq=items.reduce((s,i)=>s+i.qty,0),tv=items.reduce((s,i)=>s+i.cost*i.qty,0);
  let h=`<div class="stats-grid" style="margin-bottom:12px"><div class="sc"><div class="sl">在庫数合計</div><div class="sv">${tq} 点</div></div><div class="sc"><div class="sl">在庫評価額</div><div class="sv amb" style="font-size:15px">${tv.toLocaleString()}<span style="font-size:10px;font-weight:400"> 円</span></div></div></div>
  <div class="cs"><table class="stock-tbl"><thead><tr><th style="width:38%">商品</th><th style="width:22%">場所</th><th>在庫数</th></tr></thead><tbody>`;
  sorted.forEach(item=>{
    const days=calcDays(item.date);
    h+=`<tr><td style="font-size:11px;line-height:1.4">${item.name.substring(0,14)}${item.name.length>14?'…':''}<br><span style="color:var(--color-text-tertiary);font-size:10px">${item.cat}</span> ${days!==null?daysBadge(days):''}</td><td style="font-size:11px;color:var(--color-text-secondary)">${item.loc||'—'}</td><td><div class="qc"><button class="qb" onclick="chQty(${item.id},-1)">−</button><span class="qv" id="qty-${item.id}">${item.qty}</span><button class="qb" onclick="chQty(${item.id},1)">＋</button></div></td></tr>`;
  });
  h+=`</tbody></table></div>`;return h;
}
function renderAna(){
  const byP=[...items].sort((a,b)=>calcP(b.cost,b.sell)-calcP(a.cost,a.sell));
  const maxP=Math.max(1,...items.map(i=>calcP(i.cost,i.sell)));
  const maxC=Math.max(1,...items.map(i=>i.cost));
  const ts=items.reduce((s,i)=>s+i.qty,0),tv=items.reduce((s,i)=>s+i.cost*i.qty,0);
  let h=`<div class="stats-grid" style="margin-bottom:12px">
    <div class="sc"><div class="sl">商品種類数</div><div class="sv">${items.length}<span style="font-size:12px;font-weight:400;color:var(--color-text-secondary)"> 件</span></div></div>
    <div class="sc"><div class="sl">在庫数合計</div><div class="sv">${ts}<span style="font-size:12px;font-weight:400;color:var(--color-text-secondary)"> 点</span></div></div>
    <div class="sc"><div class="sl">在庫評価額</div><div class="sv amb" style="font-size:14px">${tv.toLocaleString()}<span style="font-size:10px;font-weight:400"> 円</span></div></div>
    <div class="sc"><div class="sl">仕入れ総額</div><div class="sv amb" style="font-size:14px">${items.reduce((s,i)=>s+i.cost*i.qty,0).toLocaleString()}<span style="font-size:10px;font-weight:400"> 円</span></div></div>
  </div>
  <div class="cs"><div class="ct">利益 vs 仕入れ価格（商品別）</div><div class="br">`;
  byP.forEach(item=>{
    const pr=calcP(item.cost,item.sell),pw=Math.max(4,Math.round((pr/maxP)*100)),cw=Math.max(4,Math.round((item.cost/maxC)*100));
    h+=`<div class="brow"><div class="blbl">${item.name.substring(0,8)}…</div><div style="flex:1;display:flex;flex-direction:column;gap:2px"><div class="btrk"><div class="bfil p" style="width:${pw}%"><span style="font-size:10px;color:#085041">${pr}円</span></div></div><div class="btrk"><div class="bfil c" style="width:${cw}%"><span style="font-size:10px;color:#633806">${item.cost}円</span></div></div></div></div>`;
  });
  h+=`</div><div class="legend"><div class="li"><div class="ld" style="background:#9FE1CB"></div>利益</div><div class="li"><div class="ld" style="background:#FAC775"></div>仕入れ価格</div></div></div>`;
  const cats={};items.forEach(i=>{cats[i.cat]=(cats[i.cat]||0)+1;});
  const maxCat=Math.max(1,...Object.values(cats));
  h+=`<div class="cs"><div class="ct">カテゴリ別商品数</div><div class="br">`;
  Object.entries(cats).forEach(([cat,cnt])=>{h+=`<div class="brow"><div class="blbl">${cat}</div><div class="btrk" style="flex:1"><div class="bfil v" style="width:${Math.round((cnt/maxCat)*100)}%"><span style="font-size:10px;color:#3C3489">${cnt}品</span></div></div></div>`;});
  h+=`</div></div>`;
  const locs={};items.forEach(i=>{if(i.loc)locs[i.loc]=(locs[i.loc]||0)+i.qty;});
  if(Object.keys(locs).length){
    const maxL=Math.max(1,...Object.values(locs));
    h+=`<div class="cs"><div class="ct">保管場所別 在庫数</div><div class="br">`;
    Object.entries(locs).sort((a,b)=>b[1]-a[1]).forEach(([loc,cnt])=>{h+=`<div class="brow"><div class="blbl">${loc}</div><div class="btrk" style="flex:1"><div class="bfil" style="background:#B5D4F4;width:${Math.round((cnt/maxL)*100)}%"><span style="font-size:10px;color:#0C447C">${cnt}個</span></div></div></div>`;});
    h+=`</div></div>`;
  }
  return h;
}
function renderDaysCfg(){
  const list=document.getElementById('days-cfg-list');if(!list)return;
  const sorted=[...daysCfg].sort((a,b)=>a.maxDays-b.maxDays);
  list.innerHTML=sorted.map((cfg,i)=>`
    <div class="days-cfg-row">
      <div class="days-cfg-label">${i===sorted.length-1?'それ以降':'〜 '}<input class="days-num-input" id="days-num-${i}" type="number" value="${cfg.maxDays===999?'':cfg.maxDays}" min="1" max="999" placeholder="日数" ${i===sorted.length-1?'disabled':''} oninput="updateDaysPreview()"/> 日以内</div>
      <div class="days-cfg-right">
        <div class="color-swatch" style="background:${cfg.color}"><input type="color" value="${cfg.color}" id="days-color-${i}" oninput="updateDaysPreview()"/></div>
        <span class="days-cfg-preview" id="days-prev-${i}" style="background:${cfg.color}20;color:${cfg.textColor};border:1px solid ${cfg.color}40">${cfg.maxDays===999?'30日超':cfg.maxDays+'日以内'}</span>
      </div>
    </div>`).join('');
  updateDaysPreview();
}
function updateDaysPreview(){
  const sorted=[...daysCfg].sort((a,b)=>a.maxDays-b.maxDays);
  sorted.forEach((cfg,i)=>{
    const ce=document.getElementById('days-color-'+i),pe=document.getElementById('days-prev-'+i),ne=document.getElementById('days-num-'+i);
    if(!ce||!pe)return;
    const color=ce.value,tc=hexToText(color),days=ne&&!ne.disabled?parseInt(ne.value)||cfg.maxDays:cfg.maxDays,lbl=i===sorted.length-1?'30日超':days+'日以内';
    pe.style.background=color+'20';pe.style.color=tc;pe.style.border=`1px solid ${color}40`;pe.textContent=lbl;
  });
  const pr=document.getElementById('days-preview-row');
  if(pr){
    pr.innerHTML=[7,20,45].map(d=>{
      let color='#888',tc='#333';
      for(let i=0;i<sorted.length;i++){
        const ce=document.getElementById('days-color-'+i),ne=document.getElementById('days-num-'+i);
        if(!ce)continue;
        const mx=ne&&!ne.disabled?parseInt(ne.value)||sorted[i].maxDays:999;
        if(d<=mx){color=ce.value;tc=hexToText(color);break;}
      }
      return`<span class="days-badge" style="background:${color}20;color:${tc};border:1px solid ${color}40">${d}日保管</span>`;
    }).join('');
  }
}
function hexToText(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16),l=(0.299*r+0.587*g+0.114*b)/255;return l>0.5?darken(hex):lighten(hex);}
function darken(hex){return'#'+hex.slice(1).replace(/../g,c=>Math.max(0,parseInt(c,16)-100).toString(16).padStart(2,'0'));}
function lighten(hex){return'#'+hex.slice(1).replace(/../g,c=>Math.min(255,parseInt(c,16)+100).toString(16).padStart(2,'0'));}
async function saveDaysCfg(){
  const sorted=[...daysCfg].sort((a,b)=>a.maxDays-b.maxDays);
  daysCfg=sorted.map((cfg,i)=>{
    const ce=document.getElementById('days-color-'+i),ne=document.getElementById('days-num-'+i);
    const color=ce?ce.value:cfg.color,maxD=ne&&!ne.disabled?(parseInt(ne.value)||cfg.maxDays):cfg.maxDays;
    return{maxDays:maxD,color,textColor:hexToText(color),label:cfg.label};
  });
  try{await window.storage.set(DK,JSON.stringify(daysCfg));}catch(e){}
  alert('保存しました');render();
}
function renderMasterList(key,elId){
  const el=document.getElementById(elId);if(!el)return;
  if(!masters[key].length){el.innerHTML=`<div class="master-empty">まだ登録がありません</div>`;return;}
  el.innerHTML=masters[key].map((v,i)=>`<div class="master-item"><span class="master-item-name">${v}</span><button class="master-del" onclick="delMaster('${key}',${i})">✕</button></div>`).join('');
}
function renderAllMasters(){renderMasterList('stores','master-stores');renderMasterList('locs','master-locs');renderMasterList('cats','master-cats');}
async function addMaster(key,inputId){
  const inp=document.getElementById(inputId),v=inp.value.trim();
  if(!v)return;if(masters[key].includes(v)){alert('すでに登録されています');return;}
  masters[key].push(v);await saveMasters();inp.value='';renderMasterList(key,'master-'+key);
}
async function delMaster(key,idx){masters[key].splice(idx,1);await saveMasters();renderMasterList(key,'master-'+key);}
function switchSettingsTab(t,el){
  document.querySelectorAll('.settings-tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');
  ['master','days','api','data'].forEach(id=>{const e=document.getElementById('settings-'+id);if(e)e.style.display=id===t?'block':'none';});
  if(t==='days')renderDaysCfg();
}
function buildSelect(sel,list,current){sel.innerHTML='<option value="">— 未選択 —</option>'+list.map(v=>`<option value="${v}" ${v===current?'selected':''}>${v}</option>`).join('');}
function populateFormSelects(item){
  buildSelect(document.getElementById('f-cat'),masters.cats,item?item.cat:'');
  buildSelect(document.getElementById('f-loc'),masters.locs,item?item.loc:'');
  buildSelect(document.getElementById('f-store'),masters.stores,item?item.store:'');
}
function updatePP(){
  const c=parseInt(document.getElementById('f-cost').value)||0,s=parseInt(document.getElementById('f-sell').value)||0,pp=document.getElementById('pp');
  if(c>0&&s>0){const p=calcP(c,s),m=calcM(c,s);document.getElementById('pp-val').textContent=fmt(p);document.getElementById('pp-sub').textContent=`利益率 ${m}% / 手数料 ${Math.round(s*0.15)}円`;pp.style.display='flex';}
  else pp.style.display='none';
}
function resetForm(){
  ['f-name','f-jan','f-asin','f-cost','f-sell','f-qty'].forEach(id=>{const el=document.getElementById(id);if(el){el.value='';delete el.dataset.autoFilled;}});
  document.getElementById('f-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('img-preview-wrap').innerHTML='<div class="img-ph">&#128247;</div>';
  document.getElementById('pp').style.display='none';
  setAsinStatus('','');
  populateFormSelects(null);
}
function openAdd(){
  editId=null;currentFetchAsin='';customPhotoData=null;
  if(asinDebounceTimer)clearTimeout(asinDebounceTimer);
  document.getElementById('modal-ttl').textContent='商品を追加';
  document.getElementById('save-btn').textContent='保存する';
  resetForm();
  updatePhotoBtnArea();
  document.getElementById('modal-ov').classList.add('open');
}
function openEdit(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  editId=id;currentFetchAsin='';customPhotoData=item.customPhoto||null;
  if(asinDebounceTimer)clearTimeout(asinDebounceTimer);
  document.getElementById('modal-ttl').textContent='商品を編集';
  document.getElementById('save-btn').textContent='更新する';
  const nf=document.getElementById('f-name');nf.value=item.name;delete nf.dataset.autoFilled;
  document.getElementById('f-jan').value=item.jan||'';
  document.getElementById('f-asin').value=item.asin||'';
  document.getElementById('f-cost').value=item.cost;
  document.getElementById('f-sell').value=item.sell;
  document.getElementById('f-qty').value=item.qty;
  document.getElementById('f-date').value=item.date||'';
  populateFormSelects(item);
  document.getElementById('pp').style.display='none';
  setAsinStatus('','');updatePP();
  updateImgWrap();
  updatePhotoBtnArea();
  document.getElementById('modal-ov').classList.add('open');
}
function closeModal(){document.getElementById('modal-ov').classList.remove('open');}
function openDelModal(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  deleteTargetId=id;
  document.getElementById('del-item-name').textContent='「'+item.name+'」';
  document.getElementById('del-ov').classList.add('open');
}
function closeDelModal(){document.getElementById('del-ov').classList.remove('open');deleteTargetId=null;}
async function confirmDelete(){
  if(!deleteTargetId)return;
  items=items.filter(i=>i.id!==deleteTargetId);
  await saveItems();closeDelModal();render();
}
function openSettings(){
  document.getElementById('settings-ov').classList.add('open');
  switchSettingsTab('master',document.querySelector('.settings-tab'));
  renderAllMasters();
  if(keepaApiKey){document.getElementById('settings-api-key').value=keepaApiKey;document.getElementById('api-key-status').textContent='APIキー設定済み';document.getElementById('api-key-status').style.color='#0F6E56';}
}
function closeSettings(){document.getElementById('settings-ov').classList.remove('open');render();}
async function saveItem(){
  const name=document.getElementById('f-name').value.trim(),cost=parseInt(document.getElementById('f-cost').value)||0,sell=parseInt(document.getElementById('f-sell').value)||0;
  if(!name||!cost||!sell){alert('商品名・仕入れ価格・販売価格は必須です');return;}
  const asin=document.getElementById('f-asin').value.trim();
  const statusEl=document.getElementById('asin-status');
  let amzPrice=null;
  if(statusEl&&statusEl.querySelector('.asin-status-txt')){const mm=(statusEl.querySelector('.asin-status-txt').textContent||'').match(/Amazon\s*([\d,]+)円/);if(mm)amzPrice=parseInt(mm[1].replace(/,/g,''));}
  if(editId){const ex=items.find(i=>i.id===editId);if(ex&&ex.amzPrice)amzPrice=amzPrice||ex.amzPrice;}
  const d={name,jan:document.getElementById('f-jan').value.trim(),asin,cost,sell,qty:parseInt(document.getElementById('f-qty').value)||0,cat:document.getElementById('f-cat').value,loc:document.getElementById('f-loc').value,store:document.getElementById('f-store').value,date:document.getElementById('f-date').value,amzPrice,customPhoto:customPhotoData||null};
  if(editId){const idx=items.findIndex(i=>i.id===editId);if(idx>=0)items[idx]={...items[idx],...d};}
  else items.push({id:Date.now(),...d});
  await saveItems();closeModal();render();
}
async function chQty(id,delta){
  const item=items.find(i=>i.id===id);if(!item)return;
  item.qty=Math.max(0,item.qty+delta);
  const el=document.getElementById('qty-'+id);if(el)el.textContent=item.qty;
  await saveItems();
}
function exportData(){
  const header='商品名,ASIN,JAN,カテゴリ,仕入れ価格,販売価格,Amazon現在価格,利益率,在庫数,保管日数,保管場所,仕入れ先,仕入れ日';
  const rows=items.map(i=>[`"${i.name}"`,i.asin||'',i.jan||'',i.cat,i.cost,i.sell,i.amzPrice||'',calcM(i.cost,i.sell)+'%',i.qty,calcDays(i.date)??'',i.loc||'',i.store||'',i.date||''].join(','));
  const csv='\uFEFF'+header+'\n'+rows.join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='sellerstock_'+new Date().toISOString().split('T')[0]+'.csv';a.click();
}
function doScan(){
  openAdd();
  const demos=[{name:'ライオン NANOX 詰め替え 800g',jan:'4903301259237',asin:'B07G3XZXHQ',cost:348,sell:780},{name:'エリエール トイレットペーパー 12R',jan:'4902011723458',asin:'B00LMKJGP0',cost:498,sell:980},{name:'ダウニー 柔軟剤 詰め替え 1.35L',jan:'4902430601238',asin:'B07PHRCC3J',cost:648,sell:1480}];
  const d=demos[Math.floor(Math.random()*demos.length)];
  setTimeout(()=>{
    document.getElementById('f-asin').value=d.asin;
    document.getElementById('f-jan').value=d.jan;
    document.getElementById('f-cost').value=d.cost;
    document.getElementById('f-sell').value=d.sell;
    document.getElementById('f-date').value=new Date().toISOString().split('T')[0];
    onAsinInput(d.asin);updatePP();
  },100);
}
load();
</script>
